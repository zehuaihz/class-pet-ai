# DuckDNS + acme.sh(DNS-01) + Nginx 反代配置模板
#
# 用途：https://<子域>.duckdns.org:8443 -> http://127.0.0.1:3000（web 容器）
# 前置：证书已由 acme.sh 签发并安装到 /etc/nginx/certs/（见 README 部署章节）
#
# 安装：cp deploy/nginx-duckdns.conf /etc/nginx/conf.d/classpet.conf
#       （把 server_name 与端口按实际替换）后 `nginx -t && systemctl reload nginx`

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name classpet.duckdns.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上传体积与超时对齐 Next.js API 默认值
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        # WebSocket（保险起见，SSE/HMR 等场景用）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
}
