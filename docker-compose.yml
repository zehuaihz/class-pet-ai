services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: class_pet_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d class_pet_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/class_pet_ai
      SESSION_SECRET: change-me
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AI_PROVIDER: mock
      AI_API_KEY: ""
      TEACHER_LOGIN_EMAIL: teacher@example.com
      TEACHER_LOGIN_PASSWORD: password123
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
